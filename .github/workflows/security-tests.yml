name: 安全测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 前后端类型检查
        run: npm run typecheck

      - name: 一次性本地存储安全回归
        run: npm run test:security

      - name: 生产依赖安全检查
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: 验证前端构建
        run: npm run build
